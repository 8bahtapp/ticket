<!DOCTYPE html>
<html lang="th">
<head>
<script>if(!localStorage.getItem("mock_role")){location.replace("index.html");}</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งค่าระบบ · 8Baht Support Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar-slot"></aside>

  <div class="main">
    <div class="topbar" id="topbar-slot"></div>

    <div class="content" id="pageContent">
      <!-- filled by script; access-gated by role -->
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const u = renderShell("admin");
  const content = document.getElementById("pageContent");
  let calYear = 2026, calMonth = 8; // demo "today"

  if(u && u.role === "agent"){
    content.innerHTML = `
      <div class="card" style="max-width:480px; margin:60px auto; text-align:center;">
        <div class="card-pad">
          <div style="color:var(--st-breach); margin-bottom:10px;">${ICONS.lock}</div>
          <h2>ไม่มีสิทธิ์เข้าถึงหน้านี้</h2>
          <p class="small">หน้าตั้งค่าระบบสงวนไว้สำหรับ Admin และ Supervisor เท่านั้น กรุณาติดต่อผู้ดูแลระบบหากต้องการสิทธิ์เพิ่มเติม</p>
          <a href="dashboard.html" class="btn btn-primary" style="margin-top:8px;">กลับไปหน้าภาพรวม</a>
        </div>
      </div>`;
  } else if(u) {
    setTopbarContext(`Role ปัจจุบัน: <span class="badge badge-role">${u.roleLabel}</span>`);

    const days = ["จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์","อาทิตย์"];
    const weekOff = ["เสาร์","อาทิตย์"];
    const isAdmin = u.role === "admin";

    const adminOnlySections = !isAdmin ? "" : `
      <div class="grid grid-2" style="margin-bottom:16px; align-items:start;">
        <div class="card">
          <div class="card-head collapsible" onclick="toggleCardBody(this)"><h3>Business Hours Engine</h3><span class="chevron">▾</span></div>
          <div class="card-body-collapsible card-pad">
            <div class="hours-grid">
              ${days.map(d => `
                <div class="hours-day">${d}</div>
                ${weekOff.includes(d) ? `
                  <div class="flex gap-8"><div class="toggle" onclick="this.classList.toggle('on')"></div><span class="hours-off">วันหยุด — สลับเป็น AI Bot อัตโนมัติ</span></div>
                ` : `
                  <div class="flex gap-8">
                    <div class="toggle on" onclick="this.classList.toggle('on')"></div>
                    <input class="input" style="width:90px;" value="08:30">
                    <span class="small">ถึง</span>
                    <input class="input" style="width:90px;" value="17:30">
                  </div>
                `}
              `).join("")}
            </div>
            <div class="divider"></div>
            <div class="flex between">
              <span class="small">นอกเวลาทำการ ระบบจะสลับ LINE OA เป็น:</span>
              <select class="select"><option>AI Bot ตอบอัตโนมัติ</option><option>Human-First Queue</option></select>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head collapsible" onclick="toggleCardBody(this)"><h3>ปฏิทินวันหยุด</h3><span class="chevron">▾</span></div>
          <div class="card-body-collapsible card-pad">
            <div class="flex between" style="margin-bottom:10px;">
              <button class="btn btn-sm" onclick="shiftMonth(-1)">← เดือนก่อน</button>
              <strong id="calLabel"></strong>
              <button class="btn btn-sm" onclick="shiftMonth(1)">เดือนถัดไป →</button>
            </div>
            <div class="cal-legend">
              <span><span class="legend-dot" style="background:var(--st-breach-bg); border:1px solid #f0c9c9;"></span>วันหยุดนักขัตฤกษ์/บริษัท</span>
              <span><span class="legend-dot" style="background:var(--surface); border:1px solid var(--accent);"></span>วันนี้</span>
            </div>
            <div class="cal-grid" id="calGrid"></div>
            <button class="btn btn-sm" style="margin-top:12px;">+ เพิ่มวันหยุด</button>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="card-head collapsible" onclick="toggleCardBody(this)">
          <h3>ตั้งค่าเป้าหมาย (Target) รายทีม</h3>
          <span class="chevron">▾</span>
        </div>
        <div class="card-body-collapsible table-wrap">
          <table>
            <thead>
              <tr>
                <th>ทีม</th>
                <th>เป้าหมายเวลาตอบกลับครั้งแรก (นาที)</th>
                <th>เป้าหมายเวลาเฉลี่ยแก้ปัญหา (นาที)</th>
                <th>เป้าหมายอัตราเกินเวลาที่กำหนด (%)</th>
                <th>เป้าหมายคะแนนความพึงพอใจ (เต็ม 10)</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="targetsBody"></tbody>
          </table>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="card-head collapsible" onclick="toggleCardBody(this)"><h3>Role & Permission Management</h3><span class="chevron">▾</span></div>
        <div class="card-body-collapsible table-wrap">
          <table>
            <thead><tr><th>Role</th><th>มองเห็นเคส</th><th>รายงาน Analytics</th><th>จัดการสมาชิก/อีเมล</th><th>จัดการสินค้า</th><th>ตั้งค่าระบบ</th></tr></thead>
            <tbody>
              <tr><td><span class="badge badge-role">Admin</span></td><td>ทุกทีม</td><td>เห็น</td><td>แก้ไขได้</td><td>ทุกทีม</td><td>แก้ไขได้ทั้งหมด</td></tr>
              <tr><td><span class="badge badge-role">Supervisor</span></td><td>เฉพาะทีมตัวเอง</td><td>เห็น</td><td>แก้ไขได้ (เฉพาะทีมตัวเอง)</td><td>เฉพาะทีมตัวเอง</td><td>จัดการสินค้าของทีมตัวเองเท่านั้น</td></tr>
              <tr><td><span class="badge badge-role">Agent</span></td><td>เฉพาะเคสในทีมตัวเอง</td><td>ไม่แสดง</td><td>ไม่แสดง</td><td>ไม่แสดง</td><td>ไม่แสดง</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    `;

    content.innerHTML = `
      <div class="content-header">
        <div><h1>ตั้งค่าระบบ${isAdmin ? " (Admin Settings)" : " — ทีม " + u.team}</h1>
        <p class="subtitle">${isAdmin ? "ตั้งเวลาทำการ วันหยุด เป้าหมาย และรายชื่อสินค้า — ทำได้เองโดยไม่ต้องผ่าน Dev" : "จัดการรายชื่อสินค้าของทีมคุณ ซึ่งเปลี่ยนแปลงได้บ่อยจึงทำได้เองโดยไม่ต้องผ่าน Dev"}</p></div>
      </div>

      ${adminOnlySections}

      <div class="card">
        <div class="card-head collapsible" onclick="toggleCardBody(this)">
          <h3>จัดการสินค้า${isAdmin ? "" : " — ทีม " + u.team}</h3>
          <span class="chevron">▾</span>
        </div>
        <div class="card-body-collapsible">
          <div class="card-pad" style="border-bottom:1px solid var(--border);">
            <button class="btn btn-sm btn-primary" onclick="openAddProductModal()">+ เพิ่มสินค้า</button>
            <span class="small" style="margin-left:8px; color:var(--text-mute);">รายชื่อสินค้าเปลี่ยนแปลงบ่อย หัวหน้าทีมเพิ่ม/ลบได้เองโดยไม่ต้องผ่าน Dev</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>กลุ่ม</th><th>ทีม</th><th>สินค้า</th><th></th></tr></thead>
              <tbody id="productsBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    `;

    if(isAdmin){
      renderCalendar();
      document.getElementById("targetsBody").innerHTML = MOCK_TEAM_TARGETS.map((t,i) => `
        <tr>
          <td><strong>${t.label}</strong></td>
          <td><input class="input" style="width:90px;" type="number" min="0" value="${t.frtTarget}" id="frt${i}"></td>
          <td><input class="input" style="width:90px;" type="number" min="0" value="${t.mttrTarget}" id="mttr${i}"></td>
          <td><input class="input" style="width:90px;" type="number" min="0" value="${t.slaTarget}" id="sla${i}"></td>
          <td><input class="input" style="width:90px;" type="number" min="0" max="10" step="0.1" value="${t.csatTarget}" id="csat${i}"></td>
          <td><button class="btn btn-sm" onclick="saveTeamTarget(${i})">บันทึก</button></td>
        </tr>
      `).join("");
    }

    renderProducts();
  }

  function renderCalendar(){
    const heads = ["จ","อ","พ","พฤ","ศ","ส","อา"];
    const monthNames = ["","มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
    document.getElementById("calLabel").textContent = `${monthNames[calMonth]} ${calYear}`;
    const key = `${calYear}-${String(calMonth).padStart(2,"0")}`;
    const holidays = MOCK_HOLIDAYS_BY_MONTH[key] || [];
    const daysInMonth = new Date(calYear, calMonth, 0).getDate();
    let firstWeekday = new Date(calYear, calMonth-1, 1).getDay(); // 0=Sun
    firstWeekday = firstWeekday === 0 ? 6 : firstWeekday - 1; // convert to Mon-first offset

    let html = heads.map(h => `<div class="cal-head">${h}</div>`).join("");
    for(let i=0;i<firstWeekday;i++) html += `<div></div>`;
    for(let d=1; d<=daysInMonth; d++){
      const isHoliday = holidays.includes(d);
      const isToday = (calYear===2026 && calMonth===8 && d===4);
      html += `<div class="cal-cell ${isHoliday?'holiday':''} ${isToday?'today':''}">${d}</div>`;
    }
    document.getElementById("calGrid").innerHTML = html;
  }

  function shiftMonth(delta){
    calMonth += delta;
    if(calMonth < 1){ calMonth = 12; calYear -= 1; }
    if(calMonth > 12){ calMonth = 1; calYear += 1; }
    renderCalendar();
  }

  function saveTeamTarget(i){
    MOCK_TEAM_TARGETS[i].frtTarget = Number(document.getElementById("frt"+i).value);
    MOCK_TEAM_TARGETS[i].mttrTarget = Number(document.getElementById("mttr"+i).value);
    MOCK_TEAM_TARGETS[i].slaTarget = Number(document.getElementById("sla"+i).value);
    MOCK_TEAM_TARGETS[i].csatTarget = Number(document.getElementById("csat"+i).value);
    flashSaved(event.target);
  }

  function scopedProducts(){
    return u.role === "admin" ? PRODUCT_CATALOG : PRODUCT_CATALOG.filter(p => p.team === u.team);
  }

  function renderProducts(){
    const rows = scopedProducts();
    document.getElementById("productsBody").innerHTML = rows.map(p => `
      <tr>
        <td>${p.group}</td>
        <td>${p.team}</td>
        <td>${p.product}</td>
        <td><button class="btn btn-sm btn-danger" onclick="confirmRemoveProduct('${p.id}')">ลบ</button></td>
      </tr>
    `).join("") || `<tr><td colspan="4" class="empty">ยังไม่มีสินค้าในทีมนี้</td></tr>`;
  }

  function openAddProductModal(){
    const teamOptions = u.role === "admin" ? TEAMS.map(t => ({value:t.code, label:t.label})) : [{value:u.team, label:u.team}];
    openFormModal({
      title:"เพิ่มสินค้าใหม่",
      fields:[
        { id:"group", label:"กลุ่ม", type:"select", options:[{value:"Software",label:"Software"},{value:"Hardware",label:"Hardware"},{value:"Service",label:"Service"}] },
        { id:"team", label:"ทีม", type:"select", options:teamOptions },
        { id:"product", label:"ชื่อสินค้า", type:"text", placeholder:"เช่น Revit" },
      ],
      confirmLabel:"เพิ่มสินค้า",
      onConfirm:(values) => {
        if(!values.product) return;
        PRODUCT_CATALOG.push({ id:"p"+(productSeq++), group:values.group, team:values.team, product:values.product });
        renderProducts();
      }
    });
  }

  function confirmRemoveProduct(id){
    const p = PRODUCT_CATALOG.find(x => x.id === id);
    if(!p) return;
    openConfirmModal({
      title:"ลบสินค้า",
      description:`ต้องการลบ "${p.product}" (ทีม ${p.team}) ออกจากรายชื่อสินค้าใช่หรือไม่?`,
      confirmLabel:"ลบสินค้า",
      danger:true,
      onConfirm:() => {
        PRODUCT_CATALOG = PRODUCT_CATALOG.filter(x => x.id !== id);
        renderProducts();
      }
    });
  }

  function flashSaved(btn){
    const original = btn.textContent;
    btn.textContent = "บันทึกแล้ว ✓";
    btn.disabled = true;
    setTimeout(() => { btn.textContent = original; btn.disabled = false; }, 1200);
  }
</script>
</body>
</html>
