<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ตั้งค่าระบบ · 8Baht Support Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar-slot"></aside>

  <div class="main">
    <div class="topbar" id="topbar-slot"></div>

    <div class="content" id="pageContent">
      <!-- filled by script; access-gated to admin role -->
    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const u = renderShell("admin");
  const content = document.getElementById("pageContent");

  if(u && u.role !== "admin"){
    content.innerHTML = `
      <div class="card" style="max-width:480px; margin:60px auto; text-align:center;">
        <div class="card-pad">
          <div style="color:var(--st-breach); margin-bottom:10px;">${ICONS.lock}</div>
          <h2>ไม่มีสิทธิ์เข้าถึงหน้านี้</h2>
          <p class="small">หน้าตั้งค่าระบบสงวนไว้สำหรับ Role: Admin เท่านั้น กรุณาติดต่อผู้ดูแลระบบหากต้องการสิทธิ์เพิ่มเติม</p>
          <a href="dashboard.html" class="btn btn-primary" style="margin-top:8px;">กลับไปหน้าภาพรวม</a>
        </div>
      </div>`;
  } else if(u) {
    setTopbarContext(`Role ปัจจุบัน: <span class="badge badge-role">${u.roleLabel}</span>`);

    const days = ["จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์","อาทิตย์"];
    const weekOff = ["เสาร์","อาทิตย์"];

    content.innerHTML = `
      <div class="content-header">
        <div><h1>ตั้งค่าระบบ (Admin Settings)</h1><p class="subtitle">ตั้งเวลาทำการ วันหยุด และดูรายงานค่าตอบแทนนอกเวลา — ทำได้เองโดยไม่ต้องผ่าน Dev</p></div>
      </div>

      <div class="grid grid-2" style="margin-bottom:16px; align-items:start;">

        <div class="card">
          <div class="card-head"><h3>Business Hours Engine</h3><span class="small">เวลาทำการปกติ</span></div>
          <div class="card-pad">
            <div class="hours-grid">
              ${days.map(d => `
                <div class="hours-day">${d}</div>
                ${weekOff.includes(d) ? `
                  <div class="flex gap-8"><div class="toggle" onclick="this.classList.toggle('on')"></div><span class="hours-off">วันหยุด — สลับเป็น AI Bot อัตโนมัติ</span></div>
                ` : `
                  <div class="flex gap-8">
                    <div class="toggle on" onclick="this.classList.toggle('on')"></div>
                    <input class="input" style="width:90px;" value="08:30">
                    <span class="small">ถึง</span>
                    <input class="input" style="width:90px;" value="17:30">
                  </div>
                `}
              `).join("")}
            </div>
            <div class="divider"></div>
            <div class="flex between">
              <span class="small">นอกเวลาทำการ ระบบจะสลับ LINE OA เป็น:</span>
              <select class="select"><option>AI Bot ตอบอัตโนมัติ</option><option>Human-First Queue</option></select>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-head"><h3>ปฏิทินวันหยุด</h3><span class="small">สิงหาคม 2026</span></div>
          <div class="card-pad">
            <div class="cal-legend">
              <span><span class="legend-dot" style="background:var(--st-breach-bg); border:1px solid #f0c9c9;"></span>วันหยุดนักขัตฤกษ์/บริษัท</span>
              <span><span class="legend-dot" style="background:var(--surface); border:1px solid var(--accent);"></span>วันนี้</span>
            </div>
            <div class="cal-grid" id="calGrid"></div>
            <button class="btn btn-sm" style="margin-top:12px;">+ เพิ่มวันหยุด</button>
          </div>
        </div>
      </div>

      <div class="card" style="margin-bottom:16px;">
        <div class="card-head"><h3>Off-Hours / OT Tracking</h3><span class="small">คำนวณจาก Timestamp การ Accept/ตอบเคสนอกเวลาทำการ</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>เจ้าหน้าที่</th><th>เคสนอกเวลา (เดือนนี้)</th><th>ชั่วโมง OT สะสม</th><th>Weight คะแนน</th><th>ค่าตอบแทนพิเศษประมาณ</th></tr></thead>
            <tbody>
              <tr><td>ธีรภัทร</td><td>6 เคส</td><td>4.5 ชม.</td><td>×1.5</td><td>฿ 1,350</td></tr>
              <tr><td>พิมพ์ชนก</td><td>2 เคส</td><td>1.2 ชม.</td><td>×1.5</td><td>฿ 360</td></tr>
              <tr><td>ณัฐพล</td><td>9 เคส</td><td>6.8 ชม.</td><td>×1.5</td><td>฿ 2,040</td></tr>
            </tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <div class="card-head"><h3>Role & Permission Management</h3></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Role</th><th>มองเห็นเคส</th><th>ข้อมูลลับลูกค้า (สัญญา/มูลค่า)</th><th>รายงาน Analytics</th><th>ตั้งค่าระบบ</th></tr></thead>
            <tbody>
              <tr><td><span class="badge badge-role">Admin</span></td><td>ทุกทีม</td><td>เห็น</td><td>เห็น</td><td>แก้ไขได้</td></tr>
              <tr><td><span class="badge badge-role">Supervisor</span></td><td>เฉพาะทีมตัวเอง</td><td>เห็น</td><td>เห็น</td><td>ดูอย่างเดียว</td></tr>
              <tr><td><span class="badge badge-role">Agent</span></td><td>เฉพาะเคสในทีมตัวเอง</td><td>ซ่อน — เห็นเฉพาะชื่อบริษัท/สิทธิ์สินค้า</td><td>ไม่แสดง</td><td>ไม่แสดง</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    `;

    // simple calendar grid for the demo month
    const heads = ["จ","อ","พ","พฤ","ศ","ส","อา"];
    let calHtml = heads.map(h => `<div class="cal-head">${h}</div>`).join("");
    const leadingBlank = 5; // demo offset so month starts mid-week
    for(let i=0;i<leadingBlank;i++) calHtml += `<div></div>`;
    for(let d=1; d<=31; d++){
      const isHoliday = MOCK_HOLIDAYS.includes(d);
      const isToday = d === 4;
      calHtml += `<div class="cal-cell ${isHoliday?'holiday':''} ${isToday?'today':''}">${d}</div>`;
    }
    document.getElementById("calGrid").innerHTML = calHtml;
  }
</script>
</body>
</html>
