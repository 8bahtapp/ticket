<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เคส & แชท · 8Baht Support Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <aside class="sidebar" id="sidebar-slot"></aside>

  <div class="main">
    <div class="topbar" id="topbar-slot"></div>

    <div class="tickets-layout resizable" id="ticketsLayout" style="--queue-w:300px; --right-w:300px;">

      <!-- LEFT: queue -->
      <div class="col-queue" id="colQueue">
        <div class="fold-strip" onclick="toggleQueueCollapse()" title="แสดงคิวเคส">
          <span class="fold-arrow">›</span>
          <span class="fold-label">คิวเคส</span>
        </div>
        <div class="queue-panel-inner" id="queuePanelInner">
          <div class="queue-search">
            <div class="search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
              <input class="input" style="width:100%;" id="searchInput" placeholder="ค้นหาบริษัท / อีเมล / เบอร์โทร / note...">
            </div>
          </div>
          <div class="queue-tabs" id="queueTabs">
            <div class="queue-tab active" data-filter="all">ทั้งหมด</div>
            <div class="queue-tab" data-filter="new">ใหม่</div>
            <div class="queue-tab" data-filter="in_progress">กำลังดำเนินการ</div>
            <div class="queue-tab" data-filter="pending">รอดำเนินการ</div>
            <div class="queue-tab" data-filter="breach">เกิน SLA</div>
            <div class="queue-tab" data-filter="closed">ปิดเคส</div>
            <div class="queue-tab" data-filter="cancel">ยกเลิก</div>
          </div>
          <div id="queueList"></div>
          <div class="panel-collapse-row">
            <button class="btn btn-sm" onclick="toggleQueueCollapse()">‹ พับซ่อนคิว</button>
          </div>
        </div>
      </div>

      <div class="resize-handle" id="handleLeft"></div>

      <!-- MIDDLE: chat -->
      <div class="col-chat">
        <div class="chat-header">
          <div class="chat-header-title">
            <div>
              <h3 id="chatCompany">—</h3>
              <span class="small mono" id="chatTicketId">—</span>
            </div>
          </div>
          <div class="chat-header-actions">
            <button class="btn btn-sm" onclick="openEditCaseModal()">แก้ไขข้อมูลเคส</button>
            <select class="select" id="statusSelect">
              <option value="new">ใหม่</option>
              <option value="in_progress">กำลังดำเนินการ</option>
              <option value="pending">รอดำเนินการ</option>
              <option value="cancel">ยกเลิก</option>
              <option value="closed">ปิดเคส</option>
            </select>
            <button class="btn btn-sm">ส่งต่อทีมอื่น</button>
          </div>
        </div>
        <div class="chat-body" id="chatBody"></div>
        <div class="composer-wrap">
          <div class="mode-switch">
            <div class="mode-btn mode-customer-active" id="btnModeCustomer" onclick="setMode('customer')">💬 ส่งหาลูกค้า (LINE)</div>
            <div class="mode-btn" id="btnModeInternal" onclick="setMode('internal')">🔒 Internal Note (ทีมเห็นเท่านั้น)</div>
          </div>
          <div class="composer for-customer" id="composerBox">
            <textarea id="composerInput" placeholder="พิมพ์ข้อความถึงลูกค้า..."></textarea>
            <button class="btn btn-primary" onclick="sendMessage()">ส่ง</button>
          </div>
          <div class="composer-hint for-customer" id="composerHint">ข้อความนี้จะถูกส่งออกไปที่ LINE ของลูกค้าทันที</div>
        </div>
      </div>

      <div class="resize-handle" id="handleRight"></div>

      <!-- RIGHT: customer info -->
      <div class="col-detail-right" id="colRight">
        <div class="fold-strip" onclick="toggleRightCollapse()" title="แสดงข้อมูลลูกค้า">
          <span class="fold-arrow">‹</span>
          <span class="fold-label">ข้อมูลลูกค้า</span>
        </div>
        <div class="panel-inner" id="rightPanelInner">
          <div class="panel-collapse-row" style="border-top:none; border-bottom:1px solid var(--border);">
            <button class="btn btn-sm" onclick="toggleRightCollapse()">พับซ่อนข้อมูลลูกค้า ›</button>
          </div>
          <div id="rightPanel"></div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
  const u = renderShell("tickets");
  let currentMode = "customer";
  let activeTicket = null;
  let visibleTickets = [];
  let currentTabFilter = "all";
  let queueCollapsed = false, rightCollapsed = false;
  let queueWidthBeforeCollapse = 300, rightWidthBeforeCollapse = 300;

  if(u){
    setTopbarContext(`Role ปัจจุบัน: <span class="badge badge-role">${u.roleLabel}</span>`);

    visibleTickets = u.role === "admin" ? MOCK_TICKETS
      : (u.role === "supervisor" ? MOCK_TICKETS : MOCK_TICKETS.filter(t => t.team === u.team));

    const params = new URLSearchParams(window.location.search);
    const wantedQuery = params.get("q");
    if(wantedQuery) document.getElementById("searchInput").value = wantedQuery;

    applyFiltersAndRender();

    const wantedId = params.get("id");
    const initialList = getFilteredList();
    const initial = initialList.find(t => t.id === wantedId) || initialList[0];
    if(initial) openTicket(initial.id);

    document.querySelectorAll(".queue-tab").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".queue-tab").forEach(t=>t.classList.remove("active"));
        tab.classList.add("active");
        currentTabFilter = tab.dataset.filter;
        applyFiltersAndRender();
      });
    });

    document.getElementById("searchInput").addEventListener("input", applyFiltersAndRender);
    document.getElementById("statusSelect").addEventListener("change", handleStatusChange);

    const layout = document.getElementById("ticketsLayout");
    initColumnResize("handleLeft", layout, "--queue-w", 220, 460, "right");
    initColumnResize("handleRight", layout, "--right-w", 220, 460, "left");
  }

  /* ---- fold-to-edge collapse for the queue / customer-info panels ---- */
  function toggleQueueCollapse(){
    const layout = document.getElementById("ticketsLayout");
    const col = document.getElementById("colQueue");
    const handle = document.getElementById("handleLeft");
    queueCollapsed = !queueCollapsed;
    if(queueCollapsed){
      queueWidthBeforeCollapse = parseInt(getComputedStyle(layout).getPropertyValue("--queue-w")) || 300;
      layout.style.setProperty("--queue-w", "40px");
      handle.classList.add("col-hidden");
    } else {
      layout.style.setProperty("--queue-w", queueWidthBeforeCollapse + "px");
      handle.classList.remove("col-hidden");
    }
    col.classList.toggle("collapsed", queueCollapsed);
  }

  function toggleRightCollapse(){
    const layout = document.getElementById("ticketsLayout");
    const col = document.getElementById("colRight");
    const handle = document.getElementById("handleRight");
    rightCollapsed = !rightCollapsed;
    if(rightCollapsed){
      rightWidthBeforeCollapse = parseInt(getComputedStyle(layout).getPropertyValue("--right-w")) || 300;
      layout.style.setProperty("--right-w", "40px");
      handle.classList.add("col-hidden");
    } else {
      layout.style.setProperty("--right-w", rightWidthBeforeCollapse + "px");
      handle.classList.remove("col-hidden");
    }
    col.classList.toggle("collapsed", rightCollapsed);
  }

  function getFilteredList(){
    let list = visibleTickets;
    if(currentTabFilter === "breach"){
      list = list.filter(t => t.breach);
    } else if(currentTabFilter !== "all"){
      list = list.filter(t => t.status === currentTabFilter);
    }
    const q = (document.getElementById("searchInput")?.value || "").trim().toLowerCase();
    if(q){
      list = list.filter(t => {
        const inNotes = t.log.some(m => (m.text||"").toLowerCase().includes(q));
        return t.company.toLowerCase().includes(q)
          || (t.email||"").toLowerCase().includes(q)
          || (t.phone||"").toLowerCase().includes(q)
          || (t.assignee||"").toLowerCase().includes(q)
          || t.id.toLowerCase().includes(q)
          || inNotes;
      });
    }
    return list;
  }

  function applyFiltersAndRender(){
    renderQueue(getFilteredList());
  }

  /** Click a company or agent name anywhere in this page to filter the queue to it. */
  function filterInPage(text, event){
    if(event) event.stopPropagation();
    document.getElementById("searchInput").value = text;
    currentTabFilter = "all";
    document.querySelectorAll(".queue-tab").forEach(t=>t.classList.remove("active"));
    document.querySelector('.queue-tab[data-filter="all"]').classList.add("active");
    if(queueCollapsed) toggleQueueCollapse();
    applyFiltersAndRender();
  }

  function renderQueue(list){
    document.getElementById("queueList").innerHTML = list.map(t => `
      <div class="ticket-item ${t.breach ? 'breach' : (t.status==='new'?'new':(t.status==='pending'?'pending':''))} ${activeTicket && activeTicket.id===t.id ? 'selected':''}" onclick="openTicket('${t.id}')">
        <div class="ticket-item-top">
          <span class="ticket-id mono">${t.id}</span>
          <span class="flex gap-6">${statusBadge(t.status)}${breachBadge(t)}</span>
        </div>
        <div class="ticket-company">
          <span class="name-link" onclick="filterInPage('${t.company.replace(/'/g,"\\'")}', event)">${t.company}</span>
          ${t.isHoliday ? `<span class="badge badge-holiday" style="margin-left:4px;"><span class="badge-dot"></span>วันหยุด</span>` : ""}
        </div>
        <div class="ticket-preview">${t.preview}</div>
        <div class="ticket-meta-row">
          <span class="small">${t.channel} · ${t.team} / ${t.product}</span>
          <span class="ticket-time">${t.time}</span>
        </div>
      </div>
    `).join("") || `<div class="empty">ไม่พบเคสที่ตรงกับเงื่อนไข</div>`;
  }

  function openTicket(id){
    activeTicket = MOCK_TICKETS.find(t => t.id === id);
    if(!activeTicket) return;
    renderQueue(getFilteredList());

    document.getElementById("chatCompany").textContent = activeTicket.company;
    document.getElementById("chatTicketId").textContent = activeTicket.id + " · " + activeTicket.channel;
    document.getElementById("statusSelect").value = activeTicket.status;

    renderChatBody();
    renderRightPanel();
  }

  function renderChatBody(){
    document.getElementById("chatBody").innerHTML = activeTicket.log.map(m => {
      if(m.type === "system") return `<div class="msg system">${m.text} · ${m.time}</div>`;
      if(m.type === "customer") return `<div class="msg customer">${m.text}<div class="msg-meta">ลูกค้า · ${m.time}</div></div>`;
      if(m.type === "internal") return `<div class="msg internal">🔒 <b>${m.who}</b> (Internal): ${m.text}<div class="msg-meta">${m.time}</div></div>`;
      return `<div class="msg agent">${m.text}<div class="msg-meta">${m.who} · ${m.time}</div></div>`;
    }).join("");
    document.getElementById("chatBody").scrollTop = 999999;
  }

  function sideBlockHeader(title){
    return `<div class="side-block-header" onclick="toggleSideBlock(this)"><h4 style="margin:0;">${title}</h4><span class="chevron">▾</span></div>`;
  }

  function renderRightPanel(){
    const t = activeTicket;
    document.getElementById("rightPanel").innerHTML = `
      <div class="side-block">
        ${sideBlockHeader("ข้อมูลลูกค้า")}
        <div class="side-block-body">
          <div class="info-row"><span class="k">บริษัท</span><span class="v"><span class="name-link" onclick="filterInPage('${t.company.replace(/'/g,"\\'")}', event)">${t.company}</span></span></div>
          <div class="info-row"><span class="k">ประเภทการให้บริการ</span><span class="v">${t.serviceType || "—"}</span></div>
          <div class="info-row"><span class="k">ช่องทางที่แจ้งเคส</span><span class="v">${t.channel}</span></div>
          <div class="info-row"><span class="k">อีเมล</span><span class="v">${t.email}</span></div>
          <div class="info-row"><span class="k">เบอร์โทรศัพท์</span><span class="v">${t.phone}</span></div>
          ${t.isHoliday ? `<div style="margin-top:8px;"><span class="badge badge-holiday"><span class="badge-dot"></span>เคสนี้รับ/ปิดในวันหยุด</span></div>` : ""}
          <div class="small" style="margin-top:6px; color:var(--text-mute);">ข้อมูลติดต่ออ้างอิงจากตอนที่เปิดเคส · แก้ไขได้ผ่านปุ่ม "แก้ไขข้อมูลเคส" ด้านบน</div>
        </div>
      </div>
      <div class="side-block">
        ${sideBlockHeader("ทีม / สินค้าที่เกี่ยวข้อง")}
        <div class="side-block-body">
          <div class="chip-list">
            <span class="chip">ทีม ${t.team}</span>
            <span class="chip">${t.product}</span>
          </div>
        </div>
      </div>
      <div class="side-block">
        ${sideBlockHeader("Sub-tasks / ทีมที่เกี่ยวข้อง")}
        <div class="side-block-body">
          <div class="info-row"><span class="k">ผู้รับผิดชอบเคส</span><span class="v"><span class="name-link" onclick="filterInPage('${(t.assignee||"").replace(/'/g,"\\'")}', event)">${t.assignee}</span></span></div>
          <div class="info-row"><span class="k">อีเมลเซลที่ดูแลบัญชี</span><span class="v">${t.salesEmail}</span></div>
          <button class="btn btn-sm" style="width:100%; margin-top:8px;">+ เพิ่ม Co-assignee ทีมอื่น</button>
        </div>
      </div>
      ${t.pendingReason ? `<div class="side-block">${sideBlockHeader("เหตุผลที่รอดำเนินการ")}<div class="side-block-body"><div class="small">${t.pendingReason}</div></div></div>` : ""}
      ${t.cancelReason ? `<div class="side-block">${sideBlockHeader("เหตุผลที่ยกเลิก")}<div class="side-block-body"><div class="small">${t.cancelReason}</div></div></div>` : ""}
      ${t.closeSummary ? `<div class="side-block">${sideBlockHeader("สรุปการปิดเคส")}<div class="side-block-body"><div class="small">${t.closeSummary}</div></div></div>` : ""}
      <div class="side-block collapsed">
        ${sideBlockHeader("Audit Log (อ่านอย่างเดียว)")}
        <div class="side-block-body">
          ${t.log.map(m => `<div class="small" style="margin-bottom:6px;">${m.time} — ${m.who || 'ระบบ'}: ${m.type === 'internal' ? 'เพิ่ม Internal Note' : (m.type==='agent' ? 'ตอบลูกค้า' : (m.type==='customer' ? 'ลูกค้าส่งข้อความ' : m.text))}</div>`).join("")}
        </div>
      </div>
    `;
  }

  function openEditCaseModal(){
    if(!activeTicket) return;
    openFormModal({
      title:"แก้ไขข้อมูลเคส",
      description:"แก้ไขชื่อบริษัท ประเภทการให้บริการ และช่องทางที่แจ้งเคสของ " + activeTicket.id,
      fields:[
        { id:"company", label:"ชื่อบริษัท", type:"text", value:activeTicket.company },
        { id:"serviceType", label:"ประเภทการให้บริการ", type:"select", value:activeTicket.serviceType, options:SERVICE_TYPES.map(s => ({value:s, label:s})) },
        { id:"channel", label:"ช่องทางที่แจ้งเคส", type:"select", value:activeTicket.channel, options:CHANNELS.map(c => ({value:c, label:c})) },
      ],
      confirmLabel:"บันทึกการแก้ไข",
      onConfirm:(values) => {
        const oldCompany = activeTicket.company;
        activeTicket.company = values.company || activeTicket.company;
        activeTicket.serviceType = values.serviceType;
        activeTicket.channel = values.channel;
        activeTicket.log.push({type:"system", text:`แก้ไขข้อมูลเคส (บริษัท/ประเภทบริการ/ช่องทาง) โดย ${u.name}${oldCompany !== activeTicket.company ? ` — เปลี่ยนชื่อบริษัทเป็น "${activeTicket.company}"` : ""}`, time:nowLabel()});
        document.getElementById("chatCompany").textContent = activeTicket.company;
        document.getElementById("chatTicketId").textContent = activeTicket.id + " · " + activeTicket.channel;
        renderChatBody();
        renderRightPanel();
        applyFiltersAndRender();
      }
    });
  }

  function handleStatusChange(e){
    const newStatus = e.target.value;
    const prevStatus = activeTicket.status;
    if(newStatus === prevStatus) return;

    if(newStatus === "pending"){
      openReasonModal({
        title:"เปลี่ยนสถานะเป็น รอดำเนินการ",
        description:"กรุณาระบุเหตุผลที่เคสนี้ต้องรอดำเนินการ (จะถูกบันทึกใน Audit Log)",
        placeholder:"เช่น รอลูกค้ายืนยันข้อมูล / รอชิ้นส่วนอะไหล่ ฯลฯ",
        confirmLabel:"บันทึกและเปลี่ยนสถานะ",
        onConfirm:(text) => {
          activeTicket.status = "pending";
          activeTicket.pendingReason = text;
          activeTicket.log.push({type:"system", text:`เปลี่ยนสถานะเป็น รอดำเนินการ — เหตุผล: ${text}`, time:nowLabel()});
          refreshAfterStatusChange();
        }
      });
    } else if(newStatus === "cancel"){
      openReasonModal({
        title:"ยกเลิกเคส",
        description:"กรุณาระบุเหตุผลการยกเลิกเคสนี้ (จะถูกบันทึกใน Audit Log)",
        placeholder:"เช่น ลูกค้าแก้ปัญหาได้เอง / แจ้งซ้ำ ฯลฯ",
        confirmLabel:"ยืนยันยกเลิกเคส",
        onConfirm:(text) => {
          activeTicket.status = "cancel";
          activeTicket.cancelReason = text;
          activeTicket.log.push({type:"system", text:`ยกเลิกเคส — เหตุผล: ${text}`, time:nowLabel()});
          refreshAfterStatusChange();
        }
      });
    } else if(newStatus === "closed"){
      openReasonModal({
        title:"ปิดเคส",
        description:`สรุปนี้จะถูกส่งให้ลูกค้า (${activeTicket.email}) และเซลที่ดูแลบัญชี (${activeTicket.salesEmail}) โดยอัตโนมัติ`,
        placeholder:"สรุปอาการ สาเหตุ และวิธีแก้ไขที่ทำให้กับลูกค้า...",
        confirmLabel:"ยืนยันปิดเคสและส่งสรุป",
        onConfirm:(text) => {
          activeTicket.status = "closed";
          activeTicket.closeSummary = text;
          activeTicket.log.push({type:"system", text:`ปิดเคส — สรุป: ${text}`, time:nowLabel()});
          activeTicket.log.push({type:"system", text:`ส่งสรุปเคสให้ลูกค้าทางอีเมลและแจ้งเซลที่ดูแลบัญชีเรียบร้อยแล้ว`, time:nowLabel()});
          refreshAfterStatusChange();
        }
      });
    } else {
      // new / in_progress — no confirmation needed
      activeTicket.status = newStatus;
      activeTicket.log.push({type:"system", text:`เปลี่ยนสถานะเป็น ${STATUS_META[newStatus].label}`, time:nowLabel()});
      refreshAfterStatusChange();
    }

    // if the modal gets dismissed without confirming, revert the dropdown
    setTimeout(() => {
      if(!document.getElementById("modalOverlay")) return;
      document.getElementById("statusSelect").value = prevStatus;
    }, 0);
  }

  function refreshAfterStatusChange(){
    document.getElementById("statusSelect").value = activeTicket.status;
    renderChatBody();
    renderRightPanel();
    applyFiltersAndRender();
  }

  function nowLabel(){
    return new Date().toLocaleTimeString("th-TH", {hour:'2-digit', minute:'2-digit'});
  }

  function setMode(mode){
    currentMode = mode;
    const box = document.getElementById("composerBox");
    const hint = document.getElementById("composerHint");
    const btnC = document.getElementById("btnModeCustomer");
    const btnI = document.getElementById("btnModeInternal");
    const input = document.getElementById("composerInput");

    if(mode === "customer"){
      box.className = "composer for-customer";
      hint.className = "composer-hint for-customer";
      hint.textContent = "ข้อความนี้จะถูกส่งออกไปที่ LINE ของลูกค้าทันที";
      btnC.className = "mode-btn mode-customer-active";
      btnI.className = "mode-btn";
      input.placeholder = "พิมพ์ข้อความถึงลูกค้า...";
    } else {
      box.className = "composer for-internal";
      hint.className = "composer-hint for-internal";
      hint.textContent = "ข้อความนี้เห็นเฉพาะเจ้าหน้าที่ในทีม ลูกค้าจะไม่เห็น";
      btnI.className = "mode-btn mode-internal-active";
      btnC.className = "mode-btn";
      input.placeholder = "พิมพ์ Internal Note ถึงทีม... (ใช้ @ชื่อ เพื่อแจ้งเตือน)";
    }
  }

  function sendMessage(){
    const input = document.getElementById("composerInput");
    if(!input.value.trim() || !activeTicket) return;
    const now = nowLabel();
    if(currentMode === "customer"){
      activeTicket.log.push({type:"agent", who:u.name, text:input.value.trim(), time:now});
    } else {
      activeTicket.log.push({type:"internal", who:u.name, text:input.value.trim(), time:now});
    }
    input.value = "";
    renderChatBody();
    renderRightPanel();
  }
</script>
</body>
</html>
